<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFE9;--ink:#2E1F17;--muted:#7A6354;--line:#E3D3C6;--accent:#8B5A3C;--accent-ink:#fff;--soft:#E8D2BE;--soft-ink:#4A2E1D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1F1511;--ink:#F3E8DF;--muted:#C4A998;--line:#3D2C24;--accent:#D4A27C;--accent-ink:#1F1511;--soft:#4A3226;--soft-ink:#F0DCC9;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1F1511;--ink:#F3E8DF;--muted:#C4A998;--line:#3D2C24;--accent:#D4A27C;--accent-ink:#1F1511;--soft:#4A3226;--soft-ink:#F0DCC9;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.7 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font:800 1.25rem "Bricolage Grotesque",sans-serif;text-decoration:none}
.logo b{color:var(--accent)}
nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav a:hover{color:var(--ink)}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1rem}
main{max-width:1040px;margin:auto;padding:0 24px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;padding:88px 0 72px}
.role{display:inline-block;background:var(--soft);color:var(--soft-ink);padding:4px 14px;border-radius:999px;font-weight:500;font-size:.9rem}
.hero h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:800;letter-spacing:-.03em;margin:20px 0}
.hero p{max-width:52ch;color:var(--muted);font-size:1.15rem;margin:0 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 24px;border-radius:10px;font-weight:500;text-decoration:none;border:2px solid var(--accent)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.alt{color:var(--accent)}
.photo{position:relative;justify-self:center;width:min(100%,420px);aspect-ratio:1}
.photo::before{content:"";position:absolute;inset:18px -18px -18px 18px;background:var(--soft);border-radius:28px}
.photo .frame{position:relative;width:100%;height:100%;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;font:800 6rem "Bricolage Grotesque",sans-serif}
.photo img{width:100%;height:100%;object-fit:cover}
section{padding:64px 0;border-top:1px solid var(--line)}
section>h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin-bottom:28px}
.about{max-width:68ch}
.about p{margin:0 0 16px}
.edu{display:grid;gap:0}
.edu div{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}
.edu div:last-child{border-bottom:0}
.edu span{color:var(--muted)}
.edu h3{font-size:1.25rem}
.edu p{margin:4px 0 0;color:var(--muted)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px 40px}
.skills h3{font-size:1.15rem;margin-bottom:6px}
.skills p{margin:0;color:var(--muted)}
.proj{display:grid;gap:0}
.proj article{display:grid;grid-template-columns:1fr auto;gap:12px 32px;padding:28px 0;border-bottom:1px solid var(--line)}
.proj article:last-child{border-bottom:0}
.proj h3{font-size:1.5rem}
.proj p{margin:8px 0 12px;color:var(--muted);max-width:60ch}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;color:var(--muted)}
.proj a.go{align-self:start;font-weight:500;color:var(--accent);text-decoration:none;border-bottom:2px solid var(--accent)}
.contact p{max-width:52ch;color:var(--muted);margin:0 0 24px}
.links{display:flex;gap:12px;flex-wrap:wrap}
footer{max-width:1040px;margin:auto;padding:32px 24px 48px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:48px 0}
  .photo{order:-1;width:280px;margin-bottom:12px}
  .edu div{grid-template-columns:1fr;gap:4px}
  .proj article{grid-template-columns:1fr}
  nav{gap:12px}
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-5deg)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translate(-22px,-22px)}to{opacity:1;transform:none}}
.hero .role,.hero h1,.hero p,.hero .btns{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero h1{animation-delay:.1s}.hero p{animation-delay:.2s}.hero .btns{animation-delay:.3s}
.photo .frame{animation:pop .8s cubic-bezier(.2,.7,.2,1) .15s both}
.photo::before{animation:slide .9s cubic-bezier(.2,.7,.2,1) .4s both}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.btn{transition:transform .2s ease}
.btn:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#home" id="logo"></a>
  <nav aria-label="Main">
    <a href="#about">About</a><a href="#education">Education</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#contact">Contact</a>
    <button id="theme" aria-label="Switch light or dark theme">◐</button>
  </nav>
</div></header>

<main id="home">
  <div class="hero">
    <div>
      <span class="role" id="role"></span>
      <h1 id="hero-name"></h1>
      <p id="intro"></p>
      <div class="btns"><a class="btn main" href="#projects">See my projects</a><a class="btn alt" href="#contact">Get in touch</a></div>
    </div>
    <div class="photo"><div class="frame" id="frame"></div></div>
  </div>

  <section id="about"><h2>About me</h2><div class="about" id="about-text"></div></section>
  <section id="education"><h2>Education</h2><div class="edu" id="edu"></div></section>
  <section id="skills"><h2>Skills and interests</h2><div class="skills" id="skills-list"></div></section>
  <section id="projects"><h2>Projects</h2><div class="proj" id="proj"></div></section>
  <section id="contact" class="contact"><h2>Let’s connect</h2><p id="contact-text"></p><div class="links" id="links"></div></section>
</main>
<footer id="foot"></footer>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first = DATA.name.split(" ")[0];
document.title = DATA.name + " | Portfolio";
$("logo").innerHTML = esc(first.toUpperCase()) + "<b>.</b>";
$("role").textContent = DATA.role;
$("hero-name").textContent = "Hi, I’m " + DATA.name + ".";
$("intro").textContent = DATA.intro;
$("frame").innerHTML = DATA.photo ? '<img src="' + esc(DATA.photo) + '" alt="' + esc(DATA.name) + '">' : esc(first.charAt(0).toUpperCase());
$("about-text").innerHTML = DATA.about.map(p => "<p>" + esc(p) + "</p>").join("");
$("edu").innerHTML = DATA.education.map(e => "<div><span>" + esc(e.year) + "</span><div style='display:block;padding:0;border:0'><h3>" + esc(e.title) + "</h3><p>" + esc(e.place) + ". " + esc(e.note) + "</p></div></div>").join("");
$("skills-list").innerHTML = DATA.skills.map(s => "<div><h3>" + esc(s.title) + "</h3><p>" + esc(s.text) + "</p></div>").join("");
$("proj").innerHTML = DATA.projects.map(p => "<article><div><h3>" + esc(p.name) + "</h3><p>" + esc(p.text) + "</p><div class='tags'>" + p.tags.map(t => "<span>" + esc(t) + "</span>").join("") + "</div></div>" + (p.link ? "<a class='go' href='" + esc(p.link) + "' target='_blank' rel='noopener'>Open project</a>" : "") + "</article>").join("");
$("contact-text").textContent = DATA.contact.text;
$("links").innerHTML =
  "<a class='btn main' href='mailto:" + esc(DATA.contact.email) + "'>Email: " + esc(DATA.contact.email) + "</a>" +
  "<a class='btn alt' href='" + esc(DATA.contact.github) + "' target='_blank' rel='noopener'>GitHub: henshipatel</a>" +
  "<a class='btn alt' href='" + esc(DATA.contact.linkedin) + "' target='_blank' rel='noopener'>LinkedIn: Henshi Patel</a>";
$("foot").textContent = "© " + new Date().getFullYear() + " " + DATA.name;

const secs = document.querySelectorAll("main>section");
if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
  secs.forEach(s => { s.classList.add("reveal"); io.observe(s); });
}

$("theme").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
